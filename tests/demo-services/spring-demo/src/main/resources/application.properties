server.port=5002
spring.main.banner-mode=off

# --- Authorization library config (everything below is the only wiring needed) ---
# authorization.yaml is on the classpath by default (authz.config-location).
# User-auth block (authz.user.*). Omit the whole block to run SERVICE-ONLY mode (§0.5).
authz.user.issuer=${MOCK_URL:http://localhost:4000}/auth
authz.user.jwks-uri=${MOCK_URL:http://localhost:4000}/auth/jwks
authz.user.audience=${API_AUDIENCE:orders-api}
authz.service-issuer=${MOCK_URL:http://localhost:4000}/sso
authz.service-jwks-uri=${MOCK_URL:http://localhost:4000}/sso/jwks
authz.role-service-url=${MOCK_URL:http://localhost:4000}

# Topic names for the library's @KafkaListener beans (connection config below)
authz.kafka.role-updates-topic=role-updates
authz.kafka.role-delete-topic=role-delete
authz.kafka.publish-roles-topic=publish-roles

# Kafka connection config — owned by the host service; consumed by Spring Boot's
# kafkaListenerContainerFactory which the library's @KafkaListener beans bind to.
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}
# group-id is NOT set here — the library generates a unique group per instance for broadcast fan-out

# Outbound service identity (client-credentials) for downstream calls
authz.token-url=${MOCK_URL:http://localhost:4000}/sso/token
authz.client-id=${CLIENT_ID:spring-demo-id}
authz.client-secret=${CLIENT_SECRET:spring-demo-secret}
